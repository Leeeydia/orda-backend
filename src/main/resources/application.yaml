spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/orda
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: 'orda-secret-key-must-be-at-least-32-characters-long'
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000