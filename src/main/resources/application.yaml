spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/orda
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 프로필 이미지 업로드 파일 크기 제한 설정 추가
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: 'orda-secret-key-must-be-at-least-32-characters-long'
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# 프로필 이미지 로컬 저장 경로 설정 추가
file:
  upload-dir: uploads/profile-images
  static-resource-dir: uploads  # 정적 리소스 루트 경로 — getParent() 제거 대응