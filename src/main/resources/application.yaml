spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

file:
  upload-dir: uploads/profile-images
  static-resource-dir: uploads

dem:
  file-path: ${DEM_FILE_PATH:}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY:}

cors:
  # 콤마 구분 origin 리스트. 운영은 application-prod.yml(또는 CORS_ALLOWED_ORIGINS env)로 주입
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

hiking:
  trail-guard:
    enabled: true
