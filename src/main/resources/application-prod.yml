spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

cors:
  # 운영 프론트 도메인을 CORS_ALLOWED_ORIGINS 환경변수로 주입 (Render 대시보드 설정)
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.orda.backend: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
